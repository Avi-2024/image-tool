<!doctype html><html lang="en"><meta charset="utf-8"><title>PixelConvert browser verification</title><style>html,body{margin:0;padding:0;background:#fff}iframe{display:block;border:0}#qa-controls{padding:16px;font:14px Arial;width:700px;max-width:90vw}button{padding:12px;margin:8px 0}pre{white-space:pre-wrap}</style><iframe title="PixelConvert responsive viewport" id="app"></iframe><div id="qa-controls"><button id="tests">Run actual browser tests</button><pre id="results">Tests have not run.</pre></div><script>
const params=new URLSearchParams(location.search),frame=document.querySelector('iframe'),width=Number(params.get('w')||1440),height=Number(params.get('h')||900);
frame.style.width=width+'px';frame.style.height=height+'px';
localStorage.setItem('pixelconvert-theme',params.get('theme')||'light');
frame.src=params.get('path')||'/';
const report=document.querySelector('#results');
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(predicate,timeout=30000){const start=Date.now();while(!predicate()){if(Date.now()-start>timeout)throw Error('Timed out waiting for UI state; ready='+frame.contentDocument?.readyState+'; hydrated='+frame.contentDocument?.documentElement.getAttribute('data-converter-hydrated')+'; rows='+frame.contentDocument?.querySelectorAll('.file-row').length+'; content='+frame.contentDocument?.querySelector('#converter')?.textContent.slice(-400));await pause(25);}}
async function fixture(name){return new File([await(await fetch('/__qa/fixtures/'+name)).blob()],name,{type:name.endsWith('.png')?'image/png':name.endsWith('.jpg')?'image/jpeg':name.endsWith('.webp')?'image/webp':'image/gif'});}
function assert(condition,detail){if(!condition)throw Error(detail);}
function clickText(doc,text){const button=[...doc.querySelectorAll('button')].find(b=>b.textContent.trim()===text);assert(button,'Missing button: '+text);assert(!button.disabled,'Disabled button: '+text);button.click();}
async function navigate(path){await new Promise(resolve=>{frame.onload=resolve;frame.src=path;});await until(()=>frame.contentDocument?.readyState==='complete'&&frame.contentDocument.querySelector('#image-input'));await until(()=>frame.contentDocument?.documentElement.getAttribute('data-converter-hydrated')==='true');const doc=frame.contentDocument;doc.defaultView.__qaNetwork=[];const nativeFetch=doc.defaultView.fetch.bind(doc.defaultView);doc.defaultView.fetch=(...args)=>{doc.defaultView.__qaNetwork.push({kind:'fetch',url:String(args[0]?.url||args[0]),method:args[1]?.method||args[0]?.method||'GET',bodyType:args[1]?.body?.constructor?.name||null});return nativeFetch(...args)};const nativeOpen=doc.defaultView.XMLHttpRequest.prototype.open;doc.defaultView.XMLHttpRequest.prototype.open=function(method,...args){doc.defaultView.__qaNetwork.push({kind:'xhr',url:String(args[0]),method});return nativeOpen.call(this,method,...args)};return doc;}
async function add(doc,files){const input=doc.querySelector('#image-input'),transfer=new DataTransfer();files.forEach(f=>transfer.items.add(f));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));await until(()=>doc.querySelectorAll('.file-row').length===files.length&&!doc.querySelector('.workspace-feedback').textContent.includes('Checking'));}
function choose(doc,value){const select=[...doc.querySelectorAll('select')][1];select.value=value;select.dispatchEvent(new Event('change',{bubbles:true}));}
function captureDownloads(doc){const downloads=[],window=doc.defaultView,original=window.URL.createObjectURL.bind(window.URL),blobs=new Map();window.URL.createObjectURL=blob=>{const url=original(blob);blobs.set(url,blob);return url};doc.addEventListener('click',e=>{const a=e.target.closest?.('a[download]');if(a){e.preventDefault();downloads.push({name:a.download,blob:blobs.get(a.href)})}},true);return downloads;}
async function output(doc,name){const downloads=captureDownloads(doc);doc.querySelector('button[aria-label^="Download "]').click();await until(()=>downloads.length);return downloads[0];}
async function inspect(blob,win){const bytes=new Uint8Array(await blob.arrayBuffer()),bitmap=await win.createImageBitmap(blob),canvas=win.document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);const pixel=Array.from(ctx.getImageData(0,0,1,1).data),data={type:blob.type,bytes:Array.from(bytes.slice(0,12)),width:bitmap.width,height:bitmap.height,pixel};bitmap.close();canvas.width=canvas.height=0;return data;}
function header(result,to){const b=result.bytes;return to==='jpg'?b[0]===255&&b[1]===216&&b[2]===255:to==='png'?[137,80,78,71,13,10,26,10].every((v,i)=>b[i]===v):String.fromCharCode(...b.slice(0,4))==='RIFF'&&String.fromCharCode(...b.slice(8,12))==='WEBP';}
const evidence=[];
async function test(name,fn){try{const detail=await fn();evidence.push({name,pass:true,detail});}catch(error){evidence.push({name,pass:false,error:error.message});}report.textContent=JSON.stringify(evidence,null,2);}

async function prepareState(){
 const state=params.get('state');if(!state)return;
 await until(()=>frame.contentDocument?.documentElement.getAttribute('data-converter-hydrated')==='true');
 const doc=frame.contentDocument;choose(doc,'webp');
 if(state==='error'){await add(doc,[await fixture('mountain.jpg'),await fixture('corrupt.png')]);clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-completed'));}
 else if(state==='processing'){const file=await fixture('large.jpg');await add(doc,Array.from({length:6},(_,i)=>new File([file],'large-'+i+'.jpg',{type:'image/jpeg'})));choose(doc,'png');}
 else {await add(doc,[await fixture('mountain.jpg'),await fixture('brand-symbol.png')]);if(state==='success'){clickText(doc,'Convert images');await until(()=>doc.querySelectorAll('.status-completed').length===2);}}
 doc.querySelector('#converter').scrollIntoView({block:'start'});report.textContent='Prepared real '+state+' state.';
}
prepareState().catch(error=>report.textContent='State preparation failed: '+error.message);

document.querySelector('#tests').onclick=async()=>{
 evidence.length=0;report.textContent='Running real browser verification…';document.querySelector('#tests').disabled=true;
 for(const [from,to,file]of [['png','jpg','alpha.png'],['jpg','png','photo.jpg'],['jpg','webp','photo.jpg'],['webp','jpg','alpha.webp'],['webp','png','alpha.webp'],['png','webp','alpha.png']])await test(from+' → '+to,async()=>{
  const doc=await navigate('/'+from+'-to-'+to+'/');await add(doc,[await fixture(file)]);clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-completed'));const out=await output(doc),result=await inspect(out.blob,doc.defaultView);assert(header(result,to),'Incorrect output signature');assert(result.type===('image/'+(to==='jpg'?'jpeg':to)),'Incorrect MIME');assert(result.width===16&&result.height===10,'Changed dimensions');assert(out.name.endsWith('.'+to),'Incorrect extension');if(to==='png'||to==='webp')if(from!=='jpg')assert(result.pixel[3]===0,'Transparency not preserved');if(to==='jpg'&&from!=='jpg')assert(result.pixel.slice(0,3).every(v=>v>245),'White background not applied');assert(doc.defaultView.__qaNetwork.every(r=>['GET','HEAD'].includes(r.method)&&!r.bodyType),'Unexpected upload-capable request: '+JSON.stringify(doc.defaultView.__qaNetwork.filter(r=>!['GET','HEAD'].includes(r.method)||r.bodyType)));return {...result,network:doc.defaultView.__qaNetwork};
 });
 await test('custom background flattening',async()=>{const doc=await navigate('/png-to-jpg/');await add(doc,[await fixture('alpha.png')]);const color=doc.querySelector('input[type=color]');Object.getOwnPropertyDescriptor(doc.defaultView.HTMLInputElement.prototype,'value').set.call(color,'#00ff00');color.dispatchEvent(new Event('input',{bubbles:true}));color.dispatchEvent(new Event('change',{bubbles:true}));await until(()=>doc.querySelector('.color-control span').textContent==='#00FF00');clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-completed'));const result=await inspect((await output(doc)).blob,doc.defaultView);assert(result.pixel[1]>230&&result.pixel[0]<25&&result.pixel[2]<25,'Custom background not applied');return result.pixel;});
 await test('JPEG EXIF orientation',async()=>{const doc=await navigate('/jpg-to-png/');await add(doc,[await fixture('orientation.jpg')]);clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-completed'));const result=await inspect((await output(doc)).blob,doc.defaultView);assert(result.width===10&&result.height===20,'EXIF orientation incorrect');return {width:result.width,height:result.height};});
 await test('canvas fallback produces valid output',async()=>{const doc=await navigate('/png-to-jpg/');Object.defineProperty(doc.defaultView,'OffscreenCanvas',{value:undefined,configurable:true});await add(doc,[await fixture('alpha.png')]);clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-completed'));const result=await inspect((await output(doc)).blob,doc.defaultView);assert(header(result,'jpg'),'Invalid fallback output');return result;});
 await test('partial failure and animated rejection',async()=>{const doc=await navigate('/');choose(doc,'png');await add(doc,[await fixture('photo.jpg'),await fixture('corrupt.png'),await fixture('animated.webp'),await fixture('unsupported.gif')]);clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-completed'));assert(doc.querySelectorAll('.status-failed').length===3,'Bad files not isolated');assert(doc.body.textContent.includes('Animated WebP'),'Missing animation explanation');return {completed:1,failed:3};});
 await test('settings invalidate stale results',async()=>{const doc=await navigate('/');choose(doc,'jpg');await add(doc,[await fixture('alpha.png')]);clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-completed'));choose(doc,'png');await until(()=>doc.querySelector('.status-pending'));assert(!doc.querySelector('button[aria-label^="Download "]'),'Stale download still offered');return 'Old output removed';});
 await test('30-file and 25MB safety limits',async()=>{let doc=await navigate('/');const image=await fixture('photo.jpg'),files=Array.from({length:31},(_,i)=>new File([image],'image-'+i+'.jpg',{type:'image/jpeg'}));const input=doc.querySelector('#image-input'),transfer=new DataTransfer();files.forEach(f=>transfer.items.add(f));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));await until(()=>doc.querySelectorAll('.file-row').length===30);assert(doc.body.textContent.includes('1 extra files'),'Missing batch warning');doc=await navigate('/');await add(doc,[new File([new Uint8Array(26*1024*1024)],'large.jpg',{type:'image/jpeg'})]);assert(doc.body.textContent.includes('exceeds 25 MB'),'Missing size error');return '31st file excluded; oversized file rejected';});
 await test('cancellation stops active queue and ignores stale output',async()=>{const doc=await navigate('/jpg-to-png/'),image=await fixture('large.jpg');await add(doc,Array.from({length:8},(_,i)=>new File([image],'large-'+i+'.jpg',{type:'image/jpeg'})));clickText(doc,'Convert images');await until(()=>[...doc.querySelectorAll('button')].some(b=>b.textContent==='Cancel conversion'));clickText(doc,'Cancel conversion');await until(()=>doc.querySelector('.status-cancelled'));await pause(1000);assert(doc.querySelectorAll('.status-processing').length===0,'Still processing');assert(doc.querySelectorAll('.status-completed').length===0,'Stale success after cancel');return {cancelled:doc.querySelectorAll('.status-cancelled').length};});
 await test('duplicate filenames and actual ZIP bytes',async()=>{const doc=await navigate('/png-to-jpg/'),file=await fixture('alpha.png');await add(doc,[file,file]);const downloads=captureDownloads(doc);clickText(doc,'Convert images');await until(()=>doc.querySelectorAll('.status-completed').length===2);clickText(doc,'Download all · ZIP');await until(()=>downloads.length>0);const zip=downloads[0],bytes=new Uint8Array(await zip.blob.arrayBuffer()),view=new DataView(bytes.buffer);assert(bytes[0]===80&&bytes[1]===75,'ZIP signature invalid');let at=0,entries=[];while(at+30<bytes.length&&view.getUint32(at,true)===0x04034b50){const method=view.getUint16(at+8,true),length=view.getUint32(at+18,true),nameLength=view.getUint16(at+26,true),extra=view.getUint16(at+28,true);const name=new TextDecoder().decode(bytes.slice(at+30,at+30+nameLength));const start=at+30+nameLength+extra;assert(method===0,'Expected stored image bytes');const content=bytes.slice(start,start+length);assert(content[0]===255&&content[1]===216,'ZIP member not JPEG');entries.push(name);at=start+length;}assert(entries.length===2&&new Set(entries).size===2,'ZIP collisions or missing files');return {name:zip.name,type:zip.blob.type,entries};});
 await test('route source mismatch is actionable',async()=>{const doc=await navigate('/png-to-jpg/');await add(doc,[await fixture('photo.jpg')]);assert(doc.body.textContent.includes('accepts PNG'),'Missing mismatch guidance');return 'Wrong source rejected';});
 await test('encoder fallback cannot masquerade as WebP and retry works',async()=>{const doc=await navigate('/png-to-webp/'),win=doc.defaultView;Object.defineProperty(win,'OffscreenCanvas',{value:undefined,configurable:true});const encode=win.HTMLCanvasElement.prototype.toBlob;win.HTMLCanvasElement.prototype.toBlob=function(callback,type,quality){return encode.call(this,callback,type==='image/webp'?'image/png':type,quality)};await add(doc,[await fixture('alpha.png')]);clickText(doc,'Convert images');await until(()=>doc.querySelector('.status-failed'));assert(doc.body.textContent.includes('cannot encode WEBP'),'Misleading output accepted');assert(!doc.querySelector('button[aria-label^="Download "]'),'Failed output downloadable');win.HTMLCanvasElement.prototype.toBlob=encode;clickText(doc,'Retry failed');await until(()=>doc.querySelector('.status-completed'));return 'PNG fallback rejected; real WebP after retry';});
 await test('all six canonical pages, sitemap and schema',async()=>{const paths=['png-to-jpg','jpg-to-png','webp-to-jpg','webp-to-png','png-to-webp','jpg-to-webp','about','contact','privacy'];const titles=new Set(),descriptions=new Set();for(const path of paths){const response=await fetch('/'+path+'/');assert(response.ok,'Page failed: '+path);const doc=new DOMParser().parseFromString(await response.text(),'text/html');assert(doc.querySelectorAll('h1').length===1,'H1 count: '+path);const canonical=doc.querySelector('link[rel=canonical]')?.href;assert(canonical?.endsWith('/'+path+'/'),'Canonical: '+path);titles.add(doc.title);descriptions.add(doc.querySelector('meta[name=description]')?.content);for(const script of doc.querySelectorAll('script[type="application/ld+json"]'))JSON.parse(script.textContent);}assert(titles.size===9&&descriptions.size===9,'Duplicated metadata');const sitemap=await(await fetch('/sitemap.xml')).text();assert((sitemap.match(/<loc>/g)||[]).length===10,'Sitemap count');return 'Nine unique pages; 10 sitemap URLs; valid JSON-LD';});
 await test('responsive widths and theme',async()=>{const sizes=[360,390,768,1024,1440],result=[];for(const width of sizes){frame.style.width=width+'px';await pause(100);const doc=frame.contentDocument;assert(doc.documentElement.scrollWidth<=width,'Horizontal overflow at '+width);result.push({width,scrollWidth:doc.documentElement.scrollWidth});}const doc=frame.contentDocument;doc.querySelector('.theme-toggle').click();assert(doc.documentElement.dataset.theme==='dark','Theme toggle failed');return result;});
 report.textContent=JSON.stringify({complete:true,passed:evidence.filter(t=>t.pass).length,failed:evidence.filter(t=>!t.pass).length,tests:evidence},null,2);document.querySelector('#tests').disabled=false;
};
</script></html>
